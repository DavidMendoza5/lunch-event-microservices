name: Build all projects

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  build-services:
    name: Build Node.js Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [kitchen, warehouse, market]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.service }}/package-lock.json
    
    - name: Install dependencies for ${{ matrix.service }}
      run: npm ci
      working-directory: ${{ matrix.service }}
    
    - name: TypeScript compilation for ${{ matrix.service }}
      run: npm run build
      working-directory: ${{ matrix.service }}

    - name: Tests for ${{ matrix.service }}
      run: npm run test
      working-directory: ${{ matrix.service }}

  build-vue-app:
    name: Build Vue.js Application
    runs-on: ubuntu-latest
    needs: build-services
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies for Vue app
      run: npm ci
      working-directory: frontend
    
    - name: TypeScript type check for Vue app
      run: npm run type-check
      working-directory: frontend
    
    - name: Build Vue app
      run: npm run build
      working-directory: frontend

  verify-deployment:
    name: Verify Deployment Readiness
    runs-on: ubuntu-latest
    needs: [build-services, build-vue-app]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify all projects built successfully
      run: |
        echo "✅ All services and frontend built successfully"
        echo "📦 Ready for deployment"